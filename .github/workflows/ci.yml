name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run Lighthouse CI against next start
        run: |
          nohup npm run start > /tmp/next-start.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ > /dev/null || { echo "server failed to come up"; cat /tmp/next-start.log; exit 1; }
          echo "server ready after ~${i}s"
          npx --no-install lhci autorun
          kill $SERVER_PID 2>/dev/null || true
